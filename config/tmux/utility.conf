# Display lazygit
if-shell 'command -v lazygit' "bind -r g display-popup -d '#{pane_current_path}' -w80% -h80% -E lazygit"


# Teams (teams-cli on its default profile) in a popup: prefix t attaches a `teams`
# session, started on first use and left running when the popup closes so chats stay
# loaded; prefix t inside it closes the popup again. Replaces tmux's clock-mode on t.
# teams.sh watch counts new messages for the status line meanwhile (see teams.sh).
if-shell 'command -v teams && command -v jq' {
	bind t if -F '#{==:#{session_name},teams}' detach-client {
		display-popup -E -w 85% -h 85% -T ' Teams ' '~/.config/tmux/teams.sh popup'
	}
	run-shell -b '~/.config/tmux/teams.sh watch'
}

# Named layouts (see layouts.sh): prefix a picks one and reshapes the window to it,
# creating or parking panes as needed; prefix A saves the current layout under a name
bind a display-popup -B -E -s "bg=${TN_BG_FLOAT}" -w 50% -h 40% "~/.config/tmux/layouts.sh pick '#{window_id}'"
bind A command-prompt -p "save layout as:" "run-shell -b \"~/.config/tmux/layouts.sh save '#{window_id}' '%%'\""

# prefix S toggles typing into every pane of the window at once (the tab shows a
# sync glyph while it is on); `:set sync<Tab>` no longer completes in tmux 3.8
bind S if -F '#{pane_synchronized}' \
	"set -w synchronize-panes off \; run-shell -b \"~/.config/tmux/notify.sh 'Sync off'\"" \
	"set -w synchronize-panes on \; run-shell -b \"~/.config/tmux/notify.sh 'Sync on'\""
