# Display lazygit
if-shell 'command -v lazygit' "bind -r g display-popup -d '#{pane_current_path}' -w80% -h80% -E lazygit"


# Named layouts (see layouts.sh): prefix a picks one and reshapes the window to it,
# creating or parking panes as needed; prefix A saves the current layout under a name
bind a display-popup -B -E -s "bg=${TN_BG_FLOAT}" -w 50% -h 40% "~/.config/tmux/layouts.sh pick '#{window_id}'"
bind A command-prompt -p "save layout as:" "run-shell -b \"~/.config/tmux/layouts.sh save '#{window_id}' '%%'\""
