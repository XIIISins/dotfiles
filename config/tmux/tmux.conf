#set -g default-terminal "tmux-256color"
set -g default-terminal "xterm-256color"
#set -ga terminal-overrides ",*256col*:Tc"
set -ga terminal-overrides ",xterm-256color:Tc"
# Claude Code quantizes to 256 colours inside tmux (the TokyoNight hex values
# turn pink-purple) unless told truecolor passes through, as Tc above does
setenv -g CLAUDE_CODE_TMUX_TRUECOLOR 1
# action key
unbind C-b
#set-option -g prefix C-t
set-option -g prefix '`'
set-option -g repeat-time 0
set-option -g focus-events on
set -g mouse on
# keep click-to-focus, border drag-resize and wheel scroll; drop mouse text selection
unbind -n MouseDrag1Pane
unbind -n DoubleClick1Pane
unbind -n TripleClick1Pane
unbind -T copy-mode MouseDrag1Pane
unbind -T copy-mode MouseDragEnd1Pane
unbind -T copy-mode DoubleClick1Pane
unbind -T copy-mode TripleClick1Pane
unbind -T copy-mode-vi MouseDrag1Pane
unbind -T copy-mode-vi MouseDragEnd1Pane
unbind -T copy-mode-vi DoubleClick1Pane
unbind -T copy-mode-vi TripleClick1Pane

# copy-mode: yank to the system clipboard (macOS, Wayland, X11, WSL)
# set-clipboard (OSC 52) covers SSH and anywhere the tools below are absent;
# copy-command needs tmux 3.2+, older versions only fill the tmux buffer
set -g set-clipboard on
set -g copy-command 'if command -v pbcopy >/dev/null; then pbcopy; elif [ -n "$WAYLAND_DISPLAY" ] && command -v wl-copy >/dev/null; then wl-copy; elif [ -n "$DISPLAY" ] && command -v xclip >/dev/null; then xclip -selection clipboard -in; elif command -v clip.exe >/dev/null; then clip.exe; else cat >/dev/null; fi'
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel \; run-shell -b "~/.config/tmux/notify.sh Copied"
bind -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel \; run-shell -b "~/.config/tmux/notify.sh Copied"

# use fish where it is installed, otherwise fall back to $SHELL
if-shell 'command -v fish' "set -g default-command 'exec fish'"

bind '`' send-key '`'

#### Key bindings

set-window-option -g mode-keys vi
# emacs keys at the `prefix :` prompt: with vi, the first Escape only drops to
# normal mode and a second one is needed to cancel
set -g status-keys emacs

set -g base-index 1
setw -g pane-base-index 1

#bind t send-key C-t
# Reload settings
bind r source-file ~/.config/tmux/tmux.conf \; run-shell -b "~/.config/tmux/notify.sh Reloaded"
# jump to window N, or show a notch notification when it doesn't exist
bind 0 if-shell -F '#{W:#{?#{==:#{window_index},0},1,}}' 'select-window -t :0' 'run-shell -b "~/.config/tmux/notify.sh \"No window 0\""'
bind 1 if-shell -F '#{W:#{?#{==:#{window_index},1},1,}}' 'select-window -t :1' 'run-shell -b "~/.config/tmux/notify.sh \"No window 1\""'
bind 2 if-shell -F '#{W:#{?#{==:#{window_index},2},1,}}' 'select-window -t :2' 'run-shell -b "~/.config/tmux/notify.sh \"No window 2\""'
bind 3 if-shell -F '#{W:#{?#{==:#{window_index},3},1,}}' 'select-window -t :3' 'run-shell -b "~/.config/tmux/notify.sh \"No window 3\""'
bind 4 if-shell -F '#{W:#{?#{==:#{window_index},4},1,}}' 'select-window -t :4' 'run-shell -b "~/.config/tmux/notify.sh \"No window 4\""'
bind 5 if-shell -F '#{W:#{?#{==:#{window_index},5},1,}}' 'select-window -t :5' 'run-shell -b "~/.config/tmux/notify.sh \"No window 5\""'
bind 6 if-shell -F '#{W:#{?#{==:#{window_index},6},1,}}' 'select-window -t :6' 'run-shell -b "~/.config/tmux/notify.sh \"No window 6\""'
bind 7 if-shell -F '#{W:#{?#{==:#{window_index},7},1,}}' 'select-window -t :7' 'run-shell -b "~/.config/tmux/notify.sh \"No window 7\""'
bind 8 if-shell -F '#{W:#{?#{==:#{window_index},8},1,}}' 'select-window -t :8' 'run-shell -b "~/.config/tmux/notify.sh \"No window 8\""'
bind 9 if-shell -F '#{W:#{?#{==:#{window_index},9},1,}}' 'select-window -t :9' 'run-shell -b "~/.config/tmux/notify.sh \"No window 9\""'
# Open current directory
bind o run-shell "cd '#{pane_current_path}' && if command -v open >/dev/null; then open .; elif command -v xdg-open >/dev/null; then xdg-open .; elif command -v explorer.exe >/dev/null; then explorer.exe .; fi"
bind -r e kill-pane -a \; run-shell -b "~/.config/tmux/notify.sh 'Other panes closed'"
bind x run-shell -b "~/.config/tmux/notify.sh --confirm 'Close pane?' 'Pane closed' kill-pane -t #{pane_id}"

# vim-like pane switching
bind -r k select-pane -U
bind -r j select-pane -D
bind -r h select-pane -L
bind -r l select-pane -R

# Moving pane: prefix + Shift+h/j/k/l swaps with the neighbour and focus follows;
# stops at the edge instead of wrapping.
bind -r H if -F '#{pane_at_left}'   '' "swap-pane -d -t '{left-of}'"
bind -r J if -F '#{pane_at_bottom}' '' "swap-pane -d -t '{down-of}'"
bind -r K if -F '#{pane_at_top}'    '' "swap-pane -d -t '{up-of}'"
bind -r L if -F '#{pane_at_right}'  '' "swap-pane -d -t '{right-of}'"

# Moving window
bind-key -n C-S-Left swap-window -t -1 \; previous-window
bind-key -n C-S-Right swap-window -t +1 \; next-window

# resizing pane
bind -r C-k resize-pane -U 15
bind -r C-j resize-pane -D 15
bind -r C-h resize-pane -L 15
bind -r C-l resize-pane -R 15

# resize mode: prefix R, then tap h/j/k/l or the arrows (5 cells; shift = 15),
# esc/enter to leave; the status line shows RESIZE while it is active
bind R switch-client -T resize
bind -T resize h resize-pane -L 5 \; switch-client -T resize
bind -T resize j resize-pane -D 5 \; switch-client -T resize
bind -T resize k resize-pane -U 5 \; switch-client -T resize
bind -T resize l resize-pane -R 5 \; switch-client -T resize
bind -T resize Left resize-pane -L 5 \; switch-client -T resize
bind -T resize Down resize-pane -D 5 \; switch-client -T resize
bind -T resize Up resize-pane -U 5 \; switch-client -T resize
bind -T resize Right resize-pane -R 5 \; switch-client -T resize
bind -T resize H resize-pane -L 15 \; switch-client -T resize
bind -T resize J resize-pane -D 15 \; switch-client -T resize
bind -T resize K resize-pane -U 15 \; switch-client -T resize
bind -T resize L resize-pane -R 15 \; switch-client -T resize
bind -T resize Escape switch-client -T root
bind -T resize Enter switch-client -T root

# pane splitting
bind '|' split-window -h -c "#{pane_current_path}"
bind '\' split-window -h -c "#{pane_current_path}"
bind '-' split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

#### basic settings

set-option -g status-justify "left"
#set-option utf8-default on
#set-option -g mouse-select-pane
set-window-option -g mode-keys vi
#set-window-option -g utf8 on
# look'n feel
set-option -g history-limit 64096

set -sg escape-time 10


# allow the title bar to adapt to whatever host you connect to
set -g set-titles on
set -g set-titles-string "#T"

# import
if-shell "uname -s | grep -q Darwin" "source ~/.config/tmux/macos.conf"

# palette first: theme.conf and statusline.conf expand its ${TN_*} variables. Parsed files
# cannot see variables set by a source-file in the same file, hence the separate files.
# ../palette also resolves when only tmux is linked from the repo.
source ~/.config/tmux/../palette/out/tokyonight-moon.tmux
source ~/.config/tmux/theme.conf
source ~/.config/tmux/statusline.conf
source ~/.config/tmux/utility.conf

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'wfxr/tmux-fzf-url'
set -g @plugin 'tmux-plugins/tmux-resurrect'

# tmux-fzf-url: scan the full scrollback (keep equal to history-limit above)
set -g @fzf-url-history-limit '64096'

# machine-local overrides (outside the repo); -q skips a missing file. Before tpm so it can add @plugin lines
source -q ~/.config/local/tmux/tmux.conf

# bootstrap tpm and the plugins on a fresh machine (needs git)
if "test ! -d ~/.config/tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.config/tmux/plugins/tpm && ~/.config/tmux/plugins/tpm/bin/install_plugins'"

run '~/.config/tmux/plugins/tpm/tpm'
