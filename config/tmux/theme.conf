#### COLOUR (TokyoNight Moon)
# values are ${TN_*} variables from palette/out/tokyonight-moon.tmux (sourced first in tmux.conf);
# edit config/palette/tokyonight-moon.palette, not the hex

# pane borders
set -g pane-border-style "fg=${TN_BG_HIGHLIGHT}"
set -g pane-active-border-style "fg=${TN_BLUE}"
# thicker lines (tmux 3.2+; -q ignores older versions)
set -gq pane-border-lines heavy
# dim the text of inactive panes; only default-coloured text changes, colours set by programs stay
# (nvim dims itself on FocusLost, see nvim/lua/config/autocmds.lua).
# fg=terminal (tmux 3.5+) resets the active pane to the terminal default; without it everything
# would stay dim, so the dimming is only applied when it is supported
run-shell "tmux set -g window-active-style \"fg=terminal\" 2>/dev/null && tmux set -g window-style \"fg=${TN_DIM}\" || true"

# copy-mode selection / choose-tree highlight
set -g mode-style "fg=${TN_FG},bg=${TN_SELECTION}"

# command prompt and messages
set -g message-style "fg=${TN_BLUE},bg=${TN_BG_HIGHLIGHT}"
# centred "notch" pill that leaves the status bar visible around it; align/width
# are newer tmux only, so older versions keep the full-width style above
run-shell "tmux set -g message-style \"align=centre,width=40,fg=${TN_FG},bg=${TN_BLACK}\" 2>/dev/null || true"
set -g message-command-style "fg=${TN_FG},bg=${TN_BG_HIGHLIGHT}"

# pane number display
set -g display-panes-active-colour "${TN_ORANGE}"
set -g display-panes-colour "${TN_BLUE}"

# clock
set -g clock-mode-colour "${TN_BLUE}"

# tmux-fzf-url popup (fzf-tmux flags)
set -g @fzf-url-fzf-options "-p 60%,35% --multi --exit-0 --no-preview --layout=reverse --border=rounded --border-label=' urls ' --border-label-pos=3 --padding=0,1 --info=inline-right --prompt='url > ' --pointer='▌' --marker='+' --color=fg:${TN_FG_DARK},bg:${TN_BG_FLOAT},hl:${TN_BLUE},fg+:${TN_FG},bg+:${TN_SELECTION},hl+:${TN_CYAN},info:${TN_COMMENT},prompt:${TN_BLUE},pointer:${TN_ORANGE},marker:${TN_GREEN},spinner:${TN_MAGENTA},header:${TN_COMMENT},border:${TN_COMMENT},label:${TN_FG_DARK},separator:${TN_FG_GUTTER},gutter:${TN_BG_FLOAT},query:${TN_FG}"
