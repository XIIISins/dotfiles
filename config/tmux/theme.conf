#### COLOUR (TokyoNight Moon)
# bg #222436  bg_dark #1e2030  bg_highlight #2f334d  fg #c8d3f5  fg_dark #828bb8
# comment #636da6  blue #82aaff  cyan #86e1fc  green #c3e88d
# magenta #c099ff  orange #ff966c  red #ff757f  yellow #ffc777

# pane borders
set -g pane-border-style "fg=#2f334d"
set -g pane-active-border-style "fg=#82aaff"

# copy-mode selection / choose-tree highlight
set -g mode-style "fg=#c8d3f5,bg=#2d3f76"

# command prompt and messages
set -g message-style "fg=#82aaff,bg=#2f334d"
# centred "notch" pill that leaves the status bar visible around it; align/width
# are newer tmux only, so older versions keep the full-width style above
run-shell 'tmux set -g message-style "align=centre,width=40,fg=#c8d3f5,bg=#000000" 2>/dev/null || true'
set -g message-command-style "fg=#c8d3f5,bg=#2f334d"

# pane number display
set -g display-panes-active-colour "#ff966c"
set -g display-panes-colour "#82aaff"

# clock
set -g clock-mode-colour "#82aaff"
