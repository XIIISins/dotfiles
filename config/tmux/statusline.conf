# vim: ft=tmux
# TokyoNight Moon statusline (colours: ${TN_*} from palette/out/tokyonight-moon.tmux)

set -g status "on"
set -g status-interval 5
set -g status-justify "left"
set -g status-style "fg=${TN_FG_DARK},bg=${TN_BG_DARK}"

set -g status-left-length "100"
set -g status-right-length "100"
set -g status-left-style NONE
set -g status-right-style NONE

set -g status-left "#{?#{==:#{client_key_table},resize},#[fg=${TN_BG_DARK} bg=${TN_ORANGE} bold],#[fg=${TN_BG_DARK} bg=${TN_BLUE} bold]} #{?#{==:#{client_key_table},resize},RESIZE,#S:#I.#P} #{?#{==:#{client_key_table},resize},#[fg=${TN_ORANGE} bg=${TN_FG_GUTTER} nobold nounderscore noitalics],#[fg=${TN_BLUE} bg=${TN_FG_GUTTER} nobold nounderscore noitalics]}#[fg=${TN_BLUE},bg=${TN_FG_GUTTER}] #(whoami) #[fg=${TN_FG_GUTTER},bg=${TN_BG_DARK}]"
# a bright SYNC segment left of the clock while synchronize-panes is on
set -g status-right "#{?pane_synchronized,#[fg=${TN_YELLOW} bg=${TN_BG_DARK} nobold nounderscore noitalics]#[fg=${TN_BG_DARK} bg=${TN_YELLOW} bold] SYNC #[fg=${TN_FG_GUTTER} bg=${TN_YELLOW} nobold nounderscore noitalics],#[fg=${TN_FG_GUTTER} bg=${TN_BG_DARK} nobold nounderscore noitalics]}#[fg=${TN_BLUE},bg=${TN_FG_GUTTER}] %H:%M #[fg=${TN_BLUE},bg=${TN_FG_GUTTER},nobold,nounderscore,noitalics]#[fg=${TN_BG_DARK},bg=${TN_BLUE},bold] #h "

# Window title priority: a name set by hand (prefix , or new-window -n, which
# turn automatic-rename off for that window) > running software > directory.
setw -g window-status-activity-style "NONE,fg=${TN_FG_DARK},bg=${TN_BG_DARK}"
setw -g window-status-separator ""
setw -g window-status-style "NONE,fg=${TN_FG_DARK},bg=${TN_BG_DARK}"
setw -g window-status-current-style "NONE"
setw -g window-status-format "#[fg=${TN_BG_DARK},bg=${TN_BG_DARK}]#[default] #I  #{?#{automatic-rename},#{?#{||:#{==:#{pane_current_command},fish},#{||:#{==:#{pane_current_command},zsh},#{||:#{==:#{pane_current_command},bash},#{==:#{pane_current_command},sh}}}},#{b:pane_current_path},#{?#{m:[0-9]*.[0-9]*.[0-9]*,#{pane_current_command}},claude,#{=15:#{pane_current_command}}}},#{=15:window_name}}#{?pane_synchronized, ,} #[fg=${TN_BG_DARK},bg=${TN_BG_DARK},nobold,nounderscore,noitalics]"
setw -g window-status-current-format "#[fg=${TN_BG_DARK},bg=${TN_FG_GUTTER}]#[fg=${TN_CYAN},bg=${TN_FG_GUTTER}] #I #[fg=${TN_FG_GUTTER},bg=${TN_BLUE}]#[fg=${TN_BG_DARK},bg=${TN_BLUE},bold] #{?#{automatic-rename},#{?#{||:#{==:#{pane_current_command},fish},#{||:#{==:#{pane_current_command},zsh},#{||:#{==:#{pane_current_command},bash},#{==:#{pane_current_command},sh}}}},#{b:pane_current_path},#{?#{m:[0-9]*.[0-9]*.[0-9]*,#{pane_current_command}},claude,#{=15:#{pane_current_command}}}},#{=15:window_name}}#{?pane_synchronized, ,} #[fg=${TN_BLUE},bg=${TN_BG_DARK},nobold]"
