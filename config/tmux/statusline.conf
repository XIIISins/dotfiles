# vim: ft=tmux
# TokyoMoon Moon statusline

set -g status "on"
set -g status-interval 5
set -g status-justify "left"
set -g status-style "fg=#828bb8,bg=#1e2030"

set -g status-left-length "100"
set -g status-right-length "100"
set -g status-left-style NONE
set -g status-right-style NONE

set -g status-left "#{?#{==:#{client_key_table},resize},#[fg=#1e2030 bg=#ff966c bold],#[fg=#1e2030 bg=#82aaff bold]} #{?#{==:#{client_key_table},resize},RESIZE,#S:#I.#P} #{?#{==:#{client_key_table},resize},#[fg=#ff966c bg=#3b4261 nobold nounderscore noitalics],#[fg=#82aaff bg=#3b4261 nobold nounderscore noitalics]}#[fg=#82aaff,bg=#3b4261] #(whoami) #[fg=#3b4261,bg=#1e2030]"
set -g status-right "#[fg=#3b4261,bg=#1e2030,nobold,nounderscore,noitalics]#[fg=#82aaff,bg=#3b4261] %H:%M #[fg=#82aaff,bg=#3b4261,nobold,nounderscore,noitalics]#[fg=#1e2030,bg=#82aaff,bold] #h "

setw -g window-status-activity-style "NONE,fg=#828bb8,bg=#1e2030"
setw -g window-status-separator ""
setw -g window-status-style "NONE,fg=#828bb8,bg=#1e2030"
setw -g window-status-current-style "NONE"
setw -g window-status-format '#[fg=#1e2030,bg=#1e2030]#[default] #I  #{?#{||:#{==:#{pane_current_command},fish},#{||:#{==:#{pane_current_command},zsh},#{||:#{==:#{pane_current_command},bash},#{==:#{pane_current_command},sh}}}},#{b:pane_current_path},#{?#{m:[0-9]*.[0-9]*.[0-9]*,#{pane_current_command}},claude,#{=15:#{pane_current_command}}}} #[fg=#1e2030,bg=#1e2030,nobold,nounderscore,noitalics]'
setw -g window-status-current-format '#[fg=#1e2030,bg=#3b4261]#[fg=#86e1fc,bg=#3b4261] #I #[fg=#3b4261,bg=#82aaff]#[fg=#1e2030,bg=#82aaff,bold] #{?#{||:#{==:#{pane_current_command},fish},#{||:#{==:#{pane_current_command},zsh},#{||:#{==:#{pane_current_command},bash},#{==:#{pane_current_command},sh}}}},#{b:pane_current_path},#{?#{m:[0-9]*.[0-9]*.[0-9]*,#{pane_current_command}},claude,#{=15:#{pane_current_command}}}} #[fg=#82aaff,bg=#1e2030,nobold]'
