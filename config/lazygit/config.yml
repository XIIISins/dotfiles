customCommands:
  - key: "C"
    command: "git cz"
    description: "commit with commitizen"
    context: "files"
    loadingText: "opening commitizen commit tool"
    output: terminal
gui:
  mouseEvents: false
  # TokyoNight Moon (config/palette); lazygit takes hex, not variables
  theme:
    activeBorderColor: ["#82aaff", bold]
    inactiveBorderColor: ["#3b4261"]
    searchingActiveBorderColor: ["#ffc777", bold]
    optionsTextColor: ["#82aaff"]
    selectedLineBgColor: ["#2d3f76"]
    inactiveViewSelectedLineBgColor: ["#2f334d"]
    cherryPickedCommitFgColor: ["#82aaff"]
    cherryPickedCommitBgColor: ["#c099ff"]
    unstagedChangesColor: ["#ff757f"]
    defaultFgColor: ["#c8d3f5"]
git:
  # run as GIT_PAGER (through sh): delta when it is installed, plain coloured
  # git output otherwise, as in config/git/config
  diffRenderers:
    - name: delta
      command: >-
        if command -v delta >/dev/null 2>&1;
        then exec delta --dark --paging=never; else exec cat; fi
