; TokyoNight Moon (config/palette/tokyonight-moon.palette). Spicetify takes hex without
; '#' and has no variables, so these are literals. The base keys recolour Spotify's own
; stylesheet, so no theme CSS is needed (user.css is only there because Spicetify wants one).
